apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventory
  namespace: inventory
  labels: {app.kubernetes.io/name: inventory, app.kubernetes.io/part-of: safeops}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector: {matchLabels: {app.kubernetes.io/name: inventory}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: inventory, app.kubernetes.io/part-of: safeops}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: inventory
          image: safeops-shop:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: SERVICE_MODE, value: inventory}
            - {name: ENVIRONMENT, value: lab}
            - {name: FAULTS_ENABLED, value: "true"}   # lab only: the incident replay uses it
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: database, key: url}}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
  strategy:
    canary:
      analysis:
        templates: [{templateName: shop-canary-health, clusterScope: true}]
        startingStep: 1
        args:
          - {name: service, value: inventory}
          - name: canary-hash
            valueFrom: {podTemplateHashValue: Latest}
      steps:
        - setWeight: 34
        - pause: {duration: 60s}
        - setWeight: 67
        - pause: {duration: 60s}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: inventory
  labels: {app.kubernetes.io/name: inventory, app.kubernetes.io/part-of: safeops}
spec:
  selector: {app.kubernetes.io/name: inventory}
  ports: [{name: http, port: 8000, targetPort: http}]
